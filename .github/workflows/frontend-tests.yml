name: Frontend Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend-tests:
    name: Vitest + Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage -- --reporter=basic

      - name: Generate coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f ./coverage/coverage-summary.json ]; then
            {
              echo "## ✅ Frontend Coverage"
              echo ""
              echo '```'
              node -e "
                const s = require('./coverage/coverage-summary.json');
                const { lines, statements, functions, branches } = s.total;
                const pct = (v) => (v.pct ?? 0).toFixed(2) + '%';
                console.log('Statements : ' + pct(statements));
                console.log('Branches   : ' + pct(branches));
                console.log('Functions  : ' + pct(functions));
                console.log('Lines      : ' + pct(lines));
              "
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ✅ Frontend Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_No coverage report was generated by the test run._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage-report
          path: frontend/coverage
          retention-days: 7
          if-no-files-found: ignore
