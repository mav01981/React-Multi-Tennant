name: E2E Tests (Playwright)
run-name: E2E Tests - ${{ github.workflow }} / ${{ github.ref_name }} / ${{ github.event_name }} / ${{ github.run_number }}
on:
  push:
    branches: ['**']
    paths:
      - 'frontend/**'
      - 'Identity.API/**'
      - 'Identity.Application/**'
      - 'Identity.Domain/**'
      - 'Identity.Infrastructure/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:

jobs:
  e2e-tests:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: dotnet build ../IdentityAuth.Api.slnx -c Debug

      # The playwright.config.ts webServer entries start both the Identity.API
      # (dotnet run, port 5099, EF InMemory with a fresh seed) and the Vite dev
      # server (port 5173, proxying /api). `dotnet run` rebuilds on the fly, but
      # building above surfaces compile errors with a clearer message first.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
