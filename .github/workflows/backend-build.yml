name: Backend Build 

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend-build:
    name: Build (net10.0)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore IdentityAuth.Api.slnx

      - name: Build
        run: dotnet build IdentityAuth.Api.slnx --no-restore -c Release /warnaserror

  backend-tests:
    name: Test & Coverage (net10.0)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore IdentityAuth.Api.slnx

      - name: Build
        run: dotnet build IdentityAuth.Api.slnx --no-restore -c Release /warnaserror

      # Runs every unit-test project under tests/ (Identity.TestSupport is a
      # shared fixture library, IsTestProject=false, and is intentionally not run).
      - name: Run tests with coverage
        shell: bash
        env:
          TEST_PROJECTS: |
            tests/Identity.Api.UnitTests
            tests/Identity.Application.UnitTests
            tests/Identity.Domain.UnitTests
            tests/Identity.Infrastructure.UnitTests
        run: |
          failed=0
          while IFS= read -r project; do
            [ -z "$project" ] && continue
            echo "=== Testing $project ==="
            dotnet test "$project" --no-build -c Release \
              --collect:"XPlat Code Coverage" \
              --results-directory ./coverage || failed=1
          done <<< "$TEST_PROJECTS"
          exit $failed

      - name: Install ReportGenerator
        shell: bash
        run: dotnet tool install --tool-path ./tools/reportgenerator dotnet-reportgenerator-globaltool

      - name: Generate coverage summary
        if: always()
        shell: bash
        run: |
          shopt -s globstar nullglob
          if compgen -G "./coverage/**/coverage.cobertura.xml" > /dev/null; then
            ./tools/reportgenerator/reportgenerator \
              -reports:"./coverage/**/coverage.cobertura.xml" \
              -targetdir:"./coverage/report" \
              -reporttypes:"TextSummary;MarkdownSummaryGithub;Html" \
              -title:"Identity Backend Coverage"
            if [ -f ./coverage/report/SummaryGithub.md ]; then
              cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "## Identity Backend Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_No coverage report files were generated by the test run._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Identity-backend-coverage-report
          path: coverage/report
          retention-days: 7
          if-no-files-found: ignore