name: Backend Build 

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend-build:
    name: Build (net10.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Identity.API

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Identity.API/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release /warnaserror

  backend-tests:
    name: Test & Coverage (net10.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Identity.API

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Identity.API/**/*.csproj', 'Identity.API.UnitTests/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ../Identity.API.UnitTests/Identity.API.UnitTests.csproj

      - name: Build
        run: dotnet build ../Identity.API.UnitTests/Identity.API.UnitTests.csproj --no-restore -c Release /warnaserror

      - name: Run tests with coverage
        shell: bash
        run: |
          dotnet test ../Identity.API.UnitTests/Identity.API.UnitTests.csproj --no-build -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage

      - name: Install ReportGenerator
        shell: bash
        run: dotnet tool install --tool-path ./tools/reportgenerator dotnet-reportgenerator-globaltool

      - name: Generate coverage summary
        if: always()
        shell: bash
        run: |
          shopt -s globstar nullglob
          if compgen -G "./coverage/**/*.xml" > /dev/null; then
            ./tools/reportgenerator/reportgenerator \
              -reports:"./coverage/**/*.cobertura.xml" \
              -targetdir:"./coverage/report" \
              -reporttypes:"TextSummary;MarkdownSummaryGithub;Html" \
              -title:"Identity.API Coverage"
            if [ -f ./coverage/report/SummaryGithub.md ]; then
              cat ./coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "## Identity.API Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "_No coverage report files were generated by the test run._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Identity.API-coverage-report
          path: Identity.API/coverage/report
          retention-days: 7
          if-no-files-found: ignore